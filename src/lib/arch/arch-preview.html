<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Parametric Nav Arch — rounded tip (single file v3)</title>
  <style>
    :root { --ink:#12101a; --bg:#fff; --muted:#6b7280; --bd:#e7e9f2; }
    *{box-sizing:border-box}
    body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0b0b10;background:#fff}
    header{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    h1{font-size:16px;margin:0}
    .wrap{padding:16px;max-width:1200px;margin:0 auto}
    .box{border:1px solid var(--bd);}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
    label{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 8px}
    input[type="number"]{width:120px}
    .btn{padding:8px 12px;border-radius:8px;background:#12101a;color:#fff;text-decoration:none;border:1px solid #2a2a40;cursor:pointer}
    .muted{color:var(--muted)}
    textarea{width:100%;min-height:160px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;background:#0f0f18;color:#dfe1ff;border:1px solid #2a2a40;border-radius:8px;padding:10px}
    svg.preview{display:block;width:100%;height:auto;background:#fff}
  </style>
</head>
<body>
<header>
  <h1>Parametric Nav Arch — ellipse base + rounded bulge (single file v3)</h1>
  <span class="muted">Corrected tip flow (no loop) • No imports • Single &lt;path&gt;</span>
</header>

<div id="host" class="box"></div>
<div class="wrap">

  <div class="row">
    <label>width <input id="w" type="number" min="320" max="8000" step="1" value="1200"></label>
    <label>top / min space (px) <input id="top" type="number" value="40" min="0" max="3000" step="1"></label>
    <label>curve height (px) <input id="curve" type="number" value="16" min="10" max="3000" step="1"></label>
    <label>base ry (px) <input id="ry" type="number" value="70" min="10" max="5000" step="1"></label>
  </div>
  <div class="row">
    <label>bulge height (px) <input id="bd" type="number" value="12" min="0" max="2000" step="1"></label>
    <label>bulge width (px) <input id="bw" type="number" value="50" min="0" max="4000" step="1"></label>
    <label>roundness (0..1) <input id="sm" type="number" value="0.84" min="0" max="1" step="0.01"></label>
    <label>tip span (px) <input id="ts" type="number" value="7" min="0" max="2000" step="1"></label>
    <label><input id="guide" type="checkbox" checked> show guide at y=top (preview only)</label>
  </div>
  <div class="row">
    <a id="download" class="btn" download="nav-arch.svg">Download SVG</a>
    <span id="metrics" class="muted">—</span>
  </div>
  <textarea id="code" readonly></textarea>
</div>

<!-- 1) GENERATOR -->
<script id="arch-generator">
(function(){
  const f=(n)=>Number(n.toFixed(6));
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

  function rxFrom(containerHeight, curve, ry){
    const c = curve/ry;
    const denom = Math.max(1e-6, 2*c - c*c);
    return (containerHeight/2) / Math.sqrt(denom);
  }
  function yEllipse(cx,cy,rx,ry,x){
    const dx=(x-cx)/rx;
    const t=1 - dx*dx;
    const root = Math.sqrt(Math.max(0,t));
    return cy - ry*root;
  }
  function tangentAtX(cx,cy,rx,ry,x){
    const cosT = clamp((x-cx)/rx, -1, 1);
    const sinT = Math.sqrt(Math.max(0,1 - cosT*cosT));
    let tx = -rx * sinT, ty = -ry * cosT;
    const L = Math.hypot(tx,ty) || 1;
    return {tx:tx/L, ty:ty/L};
  }

  function archPath(o={}){
    const containerHeight = Math.max(200, +o.width || 1200);
    const top = Math.max(0, +o.top || 100);
    const curve = Math.max(10, +o.curve || 80);
    const ry = Math.max(curve+4, +o.ry || 120);
    const H = top + curve;

    const cx=containerHeight/2, cy=top+ry;
    const rx = rxFrom(containerHeight, curve, ry);

    const half = Math.max(12, Math.min((+o.bulgeWidth||240)/2, rx-6, containerHeight/2-6));
    const xL=cx-half, xR=cx+half;
    const yA = yEllipse(cx,cy,rx,ry,cx);
    const yL = yEllipse(cx,cy,rx,ry,xL);
    const yR = yEllipse(cx,cy,rx,ry,xR);
    const maxDepth = H - yA - 1.0;
    const depth = clamp(+o.bulgeHeight || 28, 0, maxDepth);
    const tipY = yA + depth;

    const tR = tangentAtX(cx,cy,rx,ry,xR);
    const tL = tangentAtX(cx,cy,rx,ry,xL);
    const vRx=cx-xR, vRy=tipY-yR; if(tR.tx*vRx + tR.ty*vRy < 0){ tR.tx*=-1; tR.ty*=-1; }
    const vLx=cx-xL, vLy=tipY-yL; if(tL.tx*vLx + tL.ty*vLy < 0){ tL.tx*=-1; tL.ty*=-1; }

    const chordR = Math.hypot(vRx,vRy), chordL = Math.hypot(vLx,vLy);
    const chord = 0.5*(chordR+chordL);
    const joinToTip = Math.max(6, Math.hypot(cx-xR, tipY-yR));
    const rnd = clamp(+o.roundness ?? 0.6, 0, 1);

    let Ls = Math.max(8, Math.min((0.22 + 0.60*rnd)*chord, joinToTip*0.70, half*0.75, (depth+8)*1.20));
    let tspan = (typeof o.tipSpan === 'number') ? Math.abs(o.tipSpan) :
                Math.max(8, Math.min(half*0.25, (0.35 + 0.50*rnd)*Math.sqrt(Math.max(1, depth))*1.25));
    tspan = Math.min(tspan, half-6);

    const c1x = xR + tR.tx*Ls, c1y = yR + tR.ty*Ls;
    const c4x = xL + tL.tx*Ls, c4y = yL + tL.ty*Ls;
    // Corrected tip flow: first cubic ends with control to the RIGHT of tip,
    // second cubic starts with control to the LEFT of tip (both tangents leftward).
    const c2x = cx + tspan, c2y = tipY;
    const c3x = cx - tspan, c3y = tipY;

    const nR = Math.max(48, Math.round((containerHeight - xR)/12));
    const nL = Math.max(48, Math.round(xL/12));

    let d = `M 0 0 H ${f(containerHeight)} V ${f(H)}`;

    for(let i=0;i<=nR;i++){
      const t = i/nR;
      const x = containerHeight - t*(containerHeight - xR);
      const y = Math.min(yEllipse(cx,cy,rx,ry,x), H-1e-3);
      d += ` L ${f(x)} ${f(y)}`;
    }
    d += ` C ${f(c1x)} ${f(c1y)} ${f(c2x)} ${f(c2y)} ${f(cx)} ${f(tipY)}`;
    d += ` C ${f(c3x)} ${f(c3y)} ${f(c4x)} ${f(c4y)} ${f(xL)} ${f(yL)}`;

    for(let i=1;i<=nL;i++){
      const t = i/nL;
      const x = xL*(1 - t);
      const y = Math.min(yEllipse(cx,cy,rx,ry,x), H-1e-3);
      d += ` L ${f(x)} ${f(y)}`;
    }
    d += ` L 0 ${f(H)} Z`;

    return { d, width: containerHeight, height: H };
  }

  window.NavArch = { archPath };
})();
</script>

<!-- 2) PAGE WIRING -->
<script id="demo">
(function(){
  const host = document.getElementById('host');
  const code = document.getElementById('code');
  const metrics = document.getElementById('metrics');
  const download = document.getElementById('download');

  function val(id){ return +document.getElementById(id).value; }
  function checked(id){ return document.getElementById(id).checked; }

  function render(){
    const containerHeight = Math.max(360, host.clientcontainerHeightidth || window.innerWidth);
    document.getElementById('w').value = containerHeight.toFixed(0);

    const top = val('top');
    const curve = val('curve');
    const ry = val('ry');
    const bd = val('bd');
    const bw = val('bw');
    const sm = +document.getElementById('sm').value;
    const ts = val('ts');

    const { d, width, height } = window.NavArch.archPath({
      width: containerHeight, top, curve, ry,
      bulgeHeight: bd, bulgeWidth: bw, roundness: sm, tipSpan: ts
    });

    const guide = checked('guide') ? `<line x1="0" y1="${top}" x2="${width}" y2="${top}" stroke="#ff4757" stroke-width="1" stroke-dasharray="6 6"/>` : '';

    const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg class="preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" preserveAspectRatio="none">
  <path d="${d}" fill="#12101a"/>
  ${guide}
</svg>`;

    host.innerHTML = svg;
    code.value = svg;
    metrics.textContent = `W=${width} H=${height} top=${top} curve=${curve} ry=${ry} bulgeHeight=${bd} bulgeWidth=${bw} roundness=${sm} tipSpan=${ts}`;

    const blob = new Blob([svg], {type:'image/svg+xml'});
    download.href = URL.createObjectURL(blob);
  }

  ['w','top','curve','ry','bd','bw','sm','ts','guide'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  window.addEventListener('resize', render, {passive:true});
  render();
})();
</script>

</body>
</html>
