name: CI

on:
  push:
    branches:
      - main
      - staging
      - release
      - "candidate/**"
  pull_request:
    branches:
      - main
      - staging
      - release
      - "candidate/**"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate locales
        run: yarn locales

      - name: Run cycle checks
        run: yarn lint:cycles

      - name: Run branch lint (main/staging/release)
        if: >
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' ||
             github.ref == 'refs/heads/staging' ||
             github.ref == 'refs/heads/release')) ||
          (github.event_name == 'pull_request' &&
            (github.base_ref == 'main' ||
             github.base_ref == 'staging' ||
             github.base_ref == 'release'))
        run: yarn tsx scripts/lintBranch.mts

      - name: Run candidate checks (lint + tests)
        if: >
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' ||
             startsWith(github.ref, 'refs/heads/candidate/'))) ||
          (github.event_name == 'pull_request' &&
            (github.base_ref == 'main' ||
             startsWith(github.base_ref, 'candidate/')))
        run: yarn ci

      - name: Run publish checks (staging/release only)
        if: >
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/release')) ||
          (github.event_name == 'pull_request' &&
            (github.base_ref == 'staging' || github.base_ref == 'release'))
        run: yarn ci

  e2e-pages:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate locales
        run: yarn locales

      - name: Generate build inputs
        run: yarn generate --skip-cdn

      - name: Build Next.js
        run: yarn build

      - name: Install Playwright (Chromium only)
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright page renders (en/fr @ 1400/840/335)
        run: yarn test:e2e pages.visual.spec.ts

      - name: Set Chromatic archive location
        run: |
          echo "CHROMATIC_ARCHIVE_LOCATION=test-results/e2e" >> "$GITHUB_ENV"

      - name: Publish Playwright renders to Chromatic (PR gate)
        uses: chromaui/action@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          playwright: true
          forceRebuild: true
          exitOnceUploaded: true
          exitZeroOnChanges: false

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results

  chromatic:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate locales
        run: yarn locales

      - name: Generate build inputs
        run: yarn generate --skip-cdn

      - name: Build Storybook
        run: yarn build-storybook

      - name: Publish to Chromatic (PR gate)
        uses: chromaui/action@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          exitOnceUploaded: true
          exitZeroOnChanges: false
