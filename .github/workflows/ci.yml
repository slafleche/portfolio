name: CI

on:
  push:
    branches:
      - main
      - staging
      - release
      - 'candidate/**'
  pull_request:
    branches:
      - main
      - staging
      - release
      - 'candidate/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run candidate checks (lint + tests)
        if: >
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' ||
             startsWith(github.ref, 'refs/heads/candidate/'))) ||
          (github.event_name == 'pull_request' &&
            (github.base_ref == 'main' ||
             startsWith(github.base_ref, 'candidate/')))
        run: yarn ci:skipVideo

      - name: Run publish checks (staging/release only)
        if: >
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/release')) ||
          (github.event_name == 'pull_request' &&
            (github.base_ref == 'staging' || github.base_ref == 'release'))
        run: yarn ci:full
