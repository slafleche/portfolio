name: CI

on:
  push:
    branches:
      - main
      - staging
      - release
      - 'candidate/**'
  pull_request:
    branches:
      - main
      - staging
      - release

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          corepack yarn install --immutable

      - name: Run candidate checks (lint + tests)
        run: corepack yarn ci:candidate

      - name: Run publish checks (staging/release only)
        if: >
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/release')) ||
          (github.event_name == 'pull_request' &&
            (github.base_ref == 'staging' || github.base_ref == 'release'))
        run: corepack yarn ci:publish

