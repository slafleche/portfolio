version: 1.0
reference: ai.md

layers:
  tokens:
    path: 'src/tokens'
    allowed_imports: []
    forbidden_imports:
      - '../modules/**'
      - '../app/**'
    rules:
      no_css_alias: true
      measurement_math_only: true
  helpers:
    path: 'src/styles/helpers'
    allowed_imports:
      - '../**/tokens/**'
    forbidden_imports:
      - '../styles/components/**'
      - '../modules/**'
      - '../app/**'
    rules:
      required_helpers:
        - paddings
        - margins
        - borders
        - backgrounds
        - boxShadows
        - backdropFilters
      forbidden_properties:
        - padding
        - margin
        - border
        - borderRadius
        - background
        - backgroundColor
        - name: boxShadow
          allow_in:
            - 'src/styles/helpers/boxShadow.helper.ts'
        - name: backdropFilter
          allow_in:
            - 'src/styles/helpers/backdropFilter.helper.ts'
        - name: WebkitBackdropFilter
          allow_in:
            - 'src/styles/helpers/backdropFilter.helper.ts'
  modules:
    path: 'src/modules'
    allowed_imports:
      - '../styles/helpers/**'
      - '../tokens/**'
    forbidden_imports:
      - '../styles/components/**'
      - '../app/**'
    rules: {}
  styles:
    path: 'src/styles/components'
    allowed_imports:
      - '../helpers/**'
      - '../../tokens/**'
    forbidden_imports:
      - '../modules/**'
      - '../../app/**'
    rules:
      use_helpers: true
      forbidden_properties:
        - name: backdropFilter
          message:
            'Use backdropFilters.style() or
            registerBackdropFallback().'
          allow_in:
            - 'src/styles/helpers/backdropFilter.helper.ts'
        - name: WebkitBackdropFilter
          message:
            'Use backdropFilters.style() or
            registerBackdropFallback().'
          allow_in:
            - 'src/styles/helpers/backdropFilter.helper.ts'

workflow:
  talk_clarify_todo_go: true
  structured_todos:
    primer_required: true
    steps_required: true
  pause_before_coding_checklist:
    - tokens_consumed_directly
    - helpers_in_use
    - no_realiasing
